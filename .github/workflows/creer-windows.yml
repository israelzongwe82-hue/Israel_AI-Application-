name: créer-windows

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Installer dépendances
        run: npm install

      - name: Générer Setup.exe
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --win nsis --publish never

      - name: Télécharger le programme d'installation Windows
        uses: actions/upload-artifact@v4
        with:
          name: Israel-AI-Setup-Windows
          path: |
            dist/*.exe
            dist/*.blockmap
