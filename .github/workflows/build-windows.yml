name: Build Windows Setup - Israël-AI

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      - name: Installer dépendances
        run: |
          npm install
          
      - name: Build Setup.exe
        run: |
          npm run build
          
      - name: Upload Setup Windows
        uses: actions/upload-artifact@v4
        with:
          name: Israel-AI-Windows-Setup
          path: dist/*Setup*.exe
